function addReplayTrade(type){
  if(!STATE.replayMode||STATE.candles.length===0)return;
  const price=STATE.candles[STATE.candles.length-1].close;
  const time=STATE.candles[STATE.candles.length-1].time;
  STATE.replayTrades.push({type,price,time,idx:STATE.replayIndex});
  drawReplayTrades();renderPanel();
  showToast(`${type==='buy'?'BUY':'SELL'} at ${fmt(price)}`,type==='buy'?'alert-green':'alert-red');
}
function drawReplayTrades(){
  if(!STATE.replayMode)return;
  const markers=STATE.replayTrades.filter(t=>t.idx<=STATE.replayIndex).map(t=>({
    time:t.time,position:t.type==='buy'?'belowBar':'aboveBar',
    color:t.type==='buy'?'#22c55e':'#ef4444',shape:t.type==='buy'?'arrowUp':'arrowDown',
    text:`${t.type.toUpperCase()} ${fmt(t.price)}`,
  }));
  // Auto-trade entries (small arrow) and exits (circle)
  (STATE.autoTrades||[]).forEach(t=>{
    markers.push({
      time:t.entryTime,
      position:t.dir==='long'?'belowBar':'aboveBar',
      color:t.dir==='long'?'#22c55e':'#ef4444',
      shape:t.dir==='long'?'arrowUp':'arrowDown',
      text:(t.dir==='long'?'L':'S')+' '+fmt(t.entry),
    });
    if (t.closed && t.exitTime) {
      const won = t.pnl>0;
      markers.push({
        time:t.exitTime,
        position:'inBar',
        color: won?'#22c55e':'#ef4444',
        shape:'circle',
        text:(won?'+':'')+fmt(t.pnl)+' '+(t.exitReason||''),
      });
    }
  });
  if(STATE.scannerEnabled&&STATE.autoPatterns.length>0){
    STATE.autoPatterns.forEach(p=>{
      const ec=STATE.candles[Math.min(p.endIdx,STATE.candles.length-1)];
      if(ec)markers.push({time:ec.time,position:p.bearish?'aboveBar':'belowBar',color:p.bearish?'#ef4444':'#22c55e',shape:p.bearish?'arrowDown':'arrowUp',text:`${p.pattern.name} (${Math.round(p.confidence*100)}%)`});
    });
  }
  markers.sort((a,b)=>a.time-b.time);
  const seen=new Set();
  STATE.candleSeries.setMarkers(markers.filter(m=>{const k=m.time+m.text+m.position;if(seen.has(k))return false;seen.add(k);return true;}));
}
function calcPnL(){
  const trades=STATE.replayTrades.filter(t=>t.idx<=STATE.replayIndex);
  if(trades.length===0)return{total:0,wins:0,losses:0,trades:0};
  let total=0,wins=0,losses=0;
  for(let i=0;i<trades.length-1;i+=2){
    if(i+1>=trades.length)break;
    const e=trades[i],x=trades[i+1];
    const pnl=e.type==='buy'?x.price-e.price:e.price-x.price;
    total+=pnl;if(pnl>=0)wins++;else losses++;
  }
  const curPrice=STATE.candles.length>0?STATE.candles[STATE.candles.length-1].close:0;
  if(trades.length%2!==0){const last=trades[trades.length-1];total+=last.type==='buy'?curPrice-last.price:last.price-curPrice;}
  return{total,wins,losses,trades:Math.floor(trades.length/2)+(trades.length%2)};
}

            <div style="font-size:10px;color:var(--text-muted);margin-top:2px">Entrée: ${fmt(curPred.price)} → Sortie: ${fmt(curPred.endPrice||'--')} · P&L: <span style="color:${(curPred.tradePnl||0)>=0?'var(--green)':'var(--red)'}">${(curPred.tradePnl||0)>=0?'+':''}${fmt(curPred.tradePnl||0)}</span></div>
          </div>
        `:`<div style="text-align:center;padding:10px;font-size:11px;color:var(--text-muted)">En attente de signaux...</div>`}
        <div style="margin-top:8px">
          <div style="font-size:12px;font-weight:600;margin-bottom:6px">⚡ Trades Auto ouverts (${openTrades.length})</div>
          ${openTrades.length===0?`<div style="font-size:11px;color:var(--text-muted);padding:6px;text-align:center">Aucun trade ouvert.</div>`:
            `<div style="display:flex;gap:6px;margin-bottom:6px;font-size:10px;color:var(--text-muted)">
              <span>↑ Longs: <b style="color:var(--green)">${longsOpen}</b></span>
              <span>↓ Shorts: <b style="color:var(--red)">${shortsOpen}</b></span>
            </div>` +
            openTrades.slice(-12).reverse().map(t=>{
              const cur=STATE.candles[STATE.candles.length-1];
              const live=cur?((cur.close-t.entry)/t.entry*(t.dir==='long'?1:-1)*100):0;
              const liveCol=live>=0?'var(--green)':'var(--red)';
              return `<div class="pred-item">
                <div>
                  <span class="pred-sent" style="color:${t.dir==='long'?'var(--green)':'var(--red)'}">${t.dir==='long'?'↑ L':'↓ S'} ${fmt(t.entry)}</span>
                  <span style="font-size:9px;color:var(--text-muted)">${t.patternName}</span>
                </div>
                <div class="pred-result" style="color:${liveCol}">${live>=0?'+':''}${live.toFixed(2)}%</div>
              </div>`;
            }).join('')
          }
        </div>
        <div style="margin-top:10px">
          <div style="font-size:12px;font-weight:600;margin-bottom:6px">📜 Historique (${closedTrades.length} clos)</div>
          ${hist.length===0?`<div style="font-size:11px;color:var(--text-muted);padding:8px;text-align:center">Aucune prédiction.</div>`:
            hist.slice(-20).reverse().map(h=>`
              <div class="pred-item ${h.correct?'correct':h.correct===false?'wrong':''}">
                <div><span class="pred-sent" style="color:${h.direction==='bullish'?'var(--green)':'var(--red)'}">${h.direction==='bullish'?'↑':'↓'} ${Math.round(h.netConf*100)}%</span><span style="font-size:9px;color:var(--text-muted)">${h.timeLabel}</span></div>
                <div class="pred-result" style="color:${h.correct===true?'var(--green)':h.correct===false?'var(--red)':'var(--text-muted)'}">
                  ${h.correct===true?'✅ +'+fmt(h.tradePnl||0):h.correct===false?'❌ '+fmt(h.tradePnl||0):'⏳'}
                </div>
              </div>`).join('')}
        </div>
        <div class="pnl-summary" style="margin-top:8px">
          <div style="font-size:12px;font-weight:600;margin-bottom:6px">📈 Trades Manuels</div>
          <div class="pnl-row"><span class="pnl-label">Total</span><span class="pnl-val" style="color:${pnl.total>=0?'var(--green)':'var(--red)'}">${pnl.total>=0?'+':''}${fmt(pnl.total)}</span></div>
          <div class="pnl-row"><span class="pnl-label">Trades</span><span class="pnl-val">${pnl.trades}</span></div>
          <div class="pnl-row"><span class="pnl-label">Gains</span><span class="pnl-val" style="color:var(--green)">${pnl.wins}</span></div>
          <div class="pnl-row"><span class="pnl-label">Pertes</span><span class="pnl-val" style="color:var(--red)">${pnl.losses}</span></div>
        </div>
      `}
    </div>
  `;
}

function renderSettingsPanel(el){
  el.innerHTML=`
    <div style="padding:4px 0">
      <div class="toggle-row"><span>Niveaux S/R</span><div class="toggle ${STATE.srEnabled?'on':''}" onclick="toggleSR()"></div></div>
      <div class="toggle-row"><span>Scanner Auto</span><div class="toggle ${STATE.scannerEnabled?'on':''}" onclick="toggleScanner()"></div></div>
      <div class="toggle-row"><span>Mode Dessin</span><div class="toggle ${STATE.drawMode?'on':''}" onclick="toggleDraw()"></div></div>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:12px;font-weight:600;margin-bottom:8px">Couleurs du Graphique</div>
        <div class="toggle-row"><span>Hausse</span><input type="color" value="#22c55e" style="width:30px;height:24px;padding:0;border:none;cursor:pointer" onchange="STATE.candleSeries.applyOptions({upColor:this.value,wickUpColor:this.value})"></div>
        <div class="toggle-row"><span>Baisse</span><input type="color" value="#ef4444" style="width:30px;height:24px;padding:0;border:none;cursor:pointer" onchange="STATE.candleSeries.applyOptions({downColor:this.value,wickDownColor:this.value})"></div>
      </div>
      <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
        <button onclick="clearAllDrawings()" style="width:100%;padding:10px;background:var(--red-dim);color:var(--red);border:1px solid var(--red);border-radius:var(--radius);font-size:13px">Effacer tous les dessins</button>
      </div>
    </div>
  `;
}

// ============================================================
// MOBILE NAV
// ============================================================
function mobileNav(target,el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));el.classList.add('active');
  const panel=document.getElementById('side-panel');
  if(target==='chart'){panel.classList.remove('open');closeTfSheet();}
  else if(target==='tf'){panel.classList.remove('open');document.getElementById('tfSheet').classList.toggle('show');}
  else if(target==='sr'){closeTfSheet();switchTab('sr',null);panel.classList.add('open');}
  else if(target==='patterns'){closeTfSheet();switchTab('patterns',null);panel.classList.add('open');}
  else if(target==='replay'){closeTfSheet();switchTab('replay',null);panel.classList.add('open');}
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===currentTab));
  setTimeout(()=>{if(STATE.chart){STATE.chart.resize(document.getElementById('chart-container').clientWidth,document.getElementById('chart-container').clientHeight);resizeDrawCanvas();resizePatternCanvas();}},350);
}
function closeTfSheet(){document.getElementById('tfSheet').classList.remove('show');}

// ============================================================
// TOASTS
// ============================================================
function showToast(msg,cls='alert-blue'){
  const c=document.getElementById('toast-container'),t=document.createElement('div');
  t.className='toast '+cls;t.innerHTML=`<span>${msg}</span>`;c.appendChild(t);
  setTimeout(()=>{t.style.animation='toastOut .3s ease forwards';setTimeout(()=>t.remove(),300);},4000);
}

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(STATE.drawMode)toggleDraw();closeSymbolModal();closeTfSheet();closePatternOverlay();}
  if(e.key==='d'&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=='INPUT')toggleDraw();
  if(e.key===' '&&STATE.replayMode){e.preventDefault();replayTogglePlay();}
  if(e.key==='ArrowRight'&&STATE.replayMode){e.preventDefault();replayStep();}
});

// ============================================================
// START
// ============================================================
document.addEventListener('DOMContentLoaded',init);
document.getElementById('srBtn').classList.add('active');
document.getElementById('scanBtn').classList.add('active');
</script>
</body>
</html>
